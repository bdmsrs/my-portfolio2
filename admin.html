<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>বাজারঘর – অ্যাডমিন</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1d2a22;--mute:#667068;--line:#dcd8cc;--brand:#1f6b45;--danger:#b3341f;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#1d2520;--ink:#eef2ee;--mute:#9aa69d;--line:#2f3b33;--brand:#4fb87f;--danger:#ff7a63;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif}
header{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0}
main{max-width:860px;margin:0 auto;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;padding:9px 14px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.p{background:var(--brand);border-color:var(--brand);color:#fff}
button.d{color:var(--danger)}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item img,.ph{width:56px;height:56px;border-radius:6px;object-fit:cover;background:var(--line);flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .t span{color:var(--mute);font-size:.85rem}
.acts{display:flex;gap:6px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#msg{position:sticky;top:0;padding:10px 14px;border-radius:8px;margin-bottom:12px;display:none}
#msg.ok{display:block;background:var(--brand);color:#fff}
#msg.err{display:block;background:var(--danger);color:#fff}
details summary{cursor:pointer;font-weight:600}
small{color:var(--mute)}
</style>
</head>
<body>
<header><h1>বাজারঘর – অ্যাডমিন প্যানেল</h1><small id="status">সংযুক্ত নয়</small></header>
<main>
<div id="msg" role="status"></div>

<details class="box" id="setup" open>
<summary>১. GitHub সংযোগ (একবারই দিতে হবে)</summary>
<div class="row">
<div><label>GitHub ইউজারনেম</label><input id="owner" value="bdmsrs"></div>
<div><label>রিপোজিটরির নাম</label><input id="repo" value="my-portfolio"></div>
</div>
<div class="row">
<div><label>ব্রাঞ্চ</label><input id="branch" value="main"></div>
<div><label>ডেটা ফাইল</label><input id="path" value="products.json"></div>
</div>
<label>Personal Access Token</label>
<input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
<small>টোকেন শুধু এই ব্রাউজারে সেভ থাকবে। শুধু এই রিপোজিটরির "Contents: Read and write" পারমিশন দিয়ে বানান।</small>
<div class="bar"><button class="p" id="connect">সংযোগ করুন ও প্রোডাক্ট লোড করুন</button></div>
</details>

<section class="box">
<h2 style="font-size:1.05rem;margin:0" id="formTitle">২. নতুন প্রোডাক্ট</h2>
<input type="hidden" id="eid">
<label>প্রোডাক্টের নাম</label><input id="name">
<div class="row">
<div><label>বর্তমান দাম (৳)</label><input id="price" type="number" min="0" inputmode="numeric"></div>
<div><label>আগের দাম (ছাড় দেখাতে, ঐচ্ছিক)</label><input id="old" type="number" min="0" inputmode="numeric"></div>
</div>
<label>ক্যাটাগরি</label><input id="cat" list="cats" placeholder="যেমন: খাবার, ফ্যাশন"><datalist id="cats"></datalist>
<div class="row">
<div><label>ইমোজি আইকন</label><input id="emo" placeholder="🍯" maxlength="4"></div>
<div><label>ব্যাকগ্রাউন্ড রঙ</label><input id="bg" type="color" value="#dbeafe" style="height:40px;padding:2px"></div>
</div>
<label>ছবি (ঐচ্ছিক, দিলে ইমোজির বদলে ছবি দেখাবে)</label>
<input id="img" placeholder="https://...">
<input id="file" type="file" accept="image/*" style="margin-top:6px">
<div class="bar"><button class="p" id="add">প্রোডাক্ট সেভ করুন</button><button id="reset">বাতিল</button></div>
</section>

<section class="box">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
<h2 style="font-size:1.05rem;margin:0">প্রোডাক্ট তালিকা (<span id="count">০</span>)</h2>
<div class="bar" style="margin:0"><button class="p" id="publish">সাইটে পাবলিশ করুন</button><button id="dl">JSON ডাউনলোড</button></div>
</div>
<div id="list"></div>
</section>
</main>

<script>
const $=id=>document.getElementById(id);
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
let products=[],sha=null,dirty=false;
const cfgKeys=['owner','repo','branch','path','token'];

function msg(t,type='ok'){const m=$('msg');m.textContent=t;m.className=type;clearTimeout(msg.t);msg.t=setTimeout(()=>m.className='',5000)}
try{cfgKeys.forEach(k=>{const v=localStorage.getItem('adm_'+k);if(v)$(k).value=v})}catch(e){}

const api=()=>`https://api.github.com/repos/${$('owner').value.trim()}/${$('repo').value.trim()}/contents/${$('path').value.trim()}`;
const hdr=()=>({Authorization:'Bearer '+$('token').value.trim(),Accept:'application/vnd.github+json'});
const b64enc=s=>btoa(unescape(encodeURIComponent(s)));
const b64dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));

async function load(){
  const r=await fetch(api()+'?ref='+encodeURIComponent($('branch').value.trim()),{headers:hdr()});
  if(r.status===404){products=[];sha=null;return 'new'}
  if(!r.ok)throw new Error(r.status===401?'টোকেন ঠিক নয়':'লোড হয়নি ('+r.status+')');
  const j=await r.json();sha=j.sha;
  const data=JSON.parse(b64dec(j.content));
  products=Array.isArray(data)?data:(data.products||[]);
}
$('connect').onclick=async()=>{
  try{
    cfgKeys.forEach(k=>localStorage.setItem('adm_'+k,$(k).value.trim()));
  }catch(e){}
  try{
    const s=await load();
    $('status').textContent='সংযুক্ত ✓';$('setup').open=false;render();
    msg(s==='new'?'products.json এখনো নেই, প্রথম পাবলিশে তৈরি হবে।':'প্রোডাক্ট লোড হয়েছে।');
  }catch(e){msg(e.message,'err')}
};

function render(){
  $('count').textContent=bn(products.length);
  $('cats').innerHTML=[...new Set(products.map(p=>p.c))].map(c=>'<option value="'+c.replace(/"/g,'&quot;')+'">').join('');
  $('list').innerHTML=products.length?'':'<p><small>এখনো কোনো প্রোডাক্ট নেই। উপরের ফর্ম থেকে যোগ করুন।</small></p>';
  products.forEach(p=>{
    const d=document.createElement('div');d.className='item';
    let im;
    if(p.i){im=Object.assign(document.createElement('img'),{src:p.i,alt:'',loading:'lazy'})}
    else{im=document.createElement('div');im.className='ph';im.textContent=p.e||'🛍️';im.style.cssText='display:grid;place-items:center;font-size:1.8rem;background:'+(p.bg||'#ddd')}
    const t=document.createElement('div');t.className='t';
    const b=document.createElement('b');b.textContent=p.n;
    const s=document.createElement('span');s.textContent='৳'+bn(p.p)+(p.o?' (আগে ৳'+bn(p.o)+')':'')+' · '+(p.c||'—');
    t.append(b,s);
    const a=document.createElement('div');a.className='acts';
    const e=document.createElement('button');e.textContent='এডিট';e.onclick=()=>edit(p.id);
    const x=document.createElement('button');x.textContent='মুছুন';x.className='d';x.onclick=()=>del(p.id);
    a.append(e,x);d.append(im,t,a);$('list').append(d);
  });
}
function clearForm(){['eid','name','price','old','cat','emo','img','file'].forEach(k=>$(k).value='');$('bg').value='#dbeafe';$('formTitle').textContent='২. নতুন প্রোডাক্ট'}
$('reset').onclick=clearForm;

function edit(id){
  const p=products.find(x=>x.id===id);if(!p)return;
  $('eid').value=p.id;$('name').value=p.n;$('price').value=p.p;$('old').value=p.o||'';$('cat').value=p.c||'';
  $('emo').value=p.e||'';$('bg').value=p.bg||'#dbeafe';
  $('img').value=p.i&&!p.i.startsWith('data:')?p.i:'';$('formTitle').textContent='প্রোডাক্ট এডিট করছেন';
  window.scrollTo({top:0,behavior:'smooth'});
}
function del(id){if(confirm('এই প্রোডাক্ট মুছে ফেলবেন?')){products=products.filter(p=>p.id!==id);dirty=true;render();msg('মুছে ফেলা হয়েছে। সাইটে দেখতে "পাবলিশ করুন" চাপুন।')}}

function resize(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{const i=new Image();i.onload=()=>{
      const m=480,sc=Math.min(1,m/Math.max(i.width,i.height));
      const c=document.createElement('canvas');c.width=i.width*sc;c.height=i.height*sc;
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8));
    };i.onerror=rej;i.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file);
  });
}
$('add').onclick=async()=>{
  const n=$('name').value.trim(),p=Number($('price').value);
  if(!n||$('price').value===''||!(p>=0)){msg('নাম ও দাম দিন।','err');return}
  const o=Number($('old').value)||0;
  if(o&&o<=p){msg('আগের দাম বর্তমান দামের চেয়ে বেশি হতে হবে।','err');return}
  const id=$('eid').value?Number($('eid').value):(products.reduce((m,x)=>Math.max(m,Number(x.id)||0),0)+1);
  const old=products.find(x=>x.id===id);
  let i=$('img').value.trim()||(old&&old.i)||'';
  if($('file').files[0]){try{i=await resize($('file').files[0])}catch(e){msg('ছবি পড়া যায়নি।','err');return}}
  const item={id,n,c:$('cat').value.trim()||'অন্যান্য',p,o,e:$('emo').value.trim(),bg:$('bg').value};
  if(i)item.i=i;
  if(old){delete old.i;Object.assign(old,item)}else products.push(item);
  dirty=true;clearForm();render();msg('তালিকায় যোগ হয়েছে। সাইটে দেখতে "পাবলিশ করুন" চাপুন।');
};

$('publish').onclick=async()=>{
  if(!$('token').value.trim()){msg('আগে GitHub সংযোগ করুন।','err');$('setup').open=true;return}
  try{
    if(sha===null){try{await load()}catch(e){}}
    const body={message:'প্রোডাক্ট আপডেট (অ্যাডমিন প্যানেল)',content:b64enc(JSON.stringify(products,null,2)),branch:$('branch').value.trim()};
    if(sha)body.sha=sha;
    const r=await fetch(api(),{method:'PUT',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error('পাবলিশ হয়নি: '+(j.message||r.status))}
    sha=(await r.json()).content.sha;dirty=false;
    msg('পাবলিশ হয়েছে ✓ ১–২ মিনিটের মধ্যে সাইটে দেখা যাবে।');
  }catch(e){msg(e.message,'err')}
};
$('dl').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(products,null,2)],{type:'application/json'}));
  a.download='products.json';a.click();
};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
render();
</script>
</body>
</html>
